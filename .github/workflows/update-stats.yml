name: 📊 Update README Stats Cards

on:
  schedule:
    - cron: "0 3 * * *"   # Runs daily at 03:00 UTC
  workflow_dispatch:        # Allow manual trigger from Actions tab

jobs:
  update-cards:
    name: Generate & Commit SVG Cards
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Required to push committed SVGs back to repo

    steps:

      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. GitHub Stats Card ───────────────────────────────────────────────
      - name: Generate GitHub Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=${{ github.repository_owner }}
            &show_icons=true
            &theme=tokyonight
            &hide_border=true
            &bg_color=0d1117
            &title_color=70a5fd
            &icon_color=bf91f3
            &text_color=c9d1d9
            &border_radius=10
            &include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 3. Top Languages Card ──────────────────────────────────────────────
      - name: Generate Top Languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=${{ github.repository_owner }}
            &layout=compact
            &theme=tokyonight
            &hide_border=true
            &bg_color=0d1117
            &title_color=70a5fd
            &text_color=c9d1d9
            &langs_count=8
            &border_radius=10
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 4. Streak Stats Card ───────────────────────────────────────────────
      - name: Generate Streak Stats card
        uses: DenverCoder1/github-readme-streak-stats@v2
        with:
          username: ${{ github.repository_owner }}
          theme: tokyonight-duo
          hide_border: true
          background: 0D1117
          ring: 70A5FD
          fire: BF91F3
          currStreakLabel: 70A5FD
          sideLabels: 38BDAE
          dates: 8B949E
          currStreakNum: C9D1D9
          sideNums: C9D1D9
          stroke: 0D1117
          border_radius: 10
          output: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 5. Commit all generated SVGs back to repo ─────────────────────────
      - name: Commit updated SVG cards
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg profile/streak.svg
          git diff --cached --quiet && echo "No changes — SVGs unchanged, skipping commit." || \
            git commit -m "chore: 📊 auto-update README stats cards [skip ci]"
          git push
